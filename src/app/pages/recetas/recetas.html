<header class="mb-4">
  <h1 class="fs-2xl mb-1">Recetas</h1>
  <p class="text-secondary-sano mb-0">Ideas saludables para cada comida.</p>
</header>

<div class="row g-3">
  @for (recipe of recipeService.recipes(); track recipe.id) {
    <div class="col-12 md:col-6 lg:col-4">
      <a [routerLink]="['/recetas', recipe.id]" class="sano-card receta-card">
        <div class="receta-media {{ recipe.colorClass }}">
          <span class="receta-emoji" aria-hidden="true">{{ recipe.emoji }}</span>
        </div>
        <div class="receta-body">
          <h2 class="fs-md fw-bold mb-0 receta-nombre">{{ recipe.name }}</h2>
          <div class="receta-meta">
            <span class="kcal-pill"><i class="bi bi-fire"></i> {{ recipe.kcal }} kcal</span>
            <span class="fs-sm text-secondary-sano"><i class="bi bi-clock"></i> {{ recipe.minutes }} min</span>
          </div>
          <div class="receta-tags">
            <span class="chip">{{ recipe.category | titlecase }}</span>
            @for (tag of recipe.tags; track tag) {
              <span class="chip">{{ tag }}</span>
            }
          </div>
        </div>
      </a>
    </div>
  }
</div>
