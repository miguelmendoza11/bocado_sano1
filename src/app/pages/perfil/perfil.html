<header class="mb-4">
  <h1 class="fs-2xl mb-1">Perfil</h1>
  <p class="text-secondary-sano mb-0">Tus datos y tu meta.</p>
</header>

<div class="row g-3">
  <!-- Columna izquierda: quién eres y tu meta -->
  <div class="col-12 xl:col-5 perfil-col">
    <!-- Cabecera del usuario -->
    <section class="sano-card card-usuario"></section>

    <!-- Meta calculada -->
    <section class="sano-card sano-card-lime card-meta">
      <h2 class="fs-lg mb-0">Tu meta diaria</h2>
    </section>
  </div>

  <!-- Columna derecha: formulario de datos -->
  <div class="col-12 xl:col-7">
    <section class="sano-card card-datos">
      <h2 class="fs-lg mb-0">Tus datos</h2>
    </section>
  </div>

  <!-- Cerrar sesión -->
  <div class="col-12">
    <section class="sano-card card-sesion">
      <h2 class="fs-lg mb-0">Sesión</h2>
    </section>
  </div>
</div>
