<header class="mb-4">
  <h1 class="fs-2xl mb-1">Perfil</h1>
  <p class="text-secondary-sano mb-0">Tus datos y tu meta.</p>
</header>

<div class="row g-3">
  <!-- Columna izquierda: quién eres y tu meta -->
  <div class="col-12 xl:col-5 perfil-col">
    <!-- Cabecera del usuario -->
    <section class="sano-card card-usuario">
      <div class="avatar" aria-hidden="true">{{ initials() }}</div>
      @if (auth.user(); as user) {
        <div class="usuario-texto">
          <h2 class="fs-xl mb-0 text-truncate">{{ user.name }}</h2>
          <p class="text-secondary-sano mb-0 text-truncate">{{ user.email }}</p>
        </div>
      }
    </section>

    <!-- Meta calculada -->
    <section class="sano-card sano-card-lime card-meta">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 class="fs-lg mb-0">Tu meta diaria</h2>
        <span class="chip"><i class="bi bi-bullseye"></i> Perder peso</span>
      </div>
      <p class="mb-3">
        <span class="fs-4xl fw-bold lh-1">2.140</span>
        <span class="fs-md">kcal</span>
      </p>
      <div class="macros">
        <div>
          <p class="fs-sm mb-0">Carbohidratos</p>
          <p class="fw-bold mb-0">268 g</p>
        </div>
        <div>
          <p class="fs-sm mb-0">Proteína</p>
          <p class="fw-bold mb-0">134 g</p>
        </div>
        <div>
          <p class="fs-sm mb-0">Grasa</p>
          <p class="fw-bold mb-0">59 g</p>
        </div>
      </div>
    </section>
  </div>

  <!-- Columna derecha: formulario de datos -->
  <div class="col-12 xl:col-7">
    <section class="sano-card card-datos">
      <h2 class="fs-lg mb-3">Tus datos</h2>

      <div class="row g-3">
        <div class="col-12 md:col-6">
          <label for="perfil-sexo" class="form-label">Sexo</label>
          <select id="perfil-sexo" class="form-control">
            <option>Hombre</option>
            <option>Mujer</option>
          </select>
        </div>
        <div class="col-12 md:col-6">
          <label for="perfil-edad" class="form-label">Edad</label>
          <input id="perfil-edad" type="number" class="form-control" value="24" />
        </div>
        <div class="col-12 md:col-6">
          <label for="perfil-altura" class="form-label">Altura (cm)</label>
          <input id="perfil-altura" type="number" class="form-control" value="175" />
        </div>
        <div class="col-12 md:col-6">
          <label for="perfil-peso" class="form-label">Peso (kg)</label>
          <input id="perfil-peso" type="number" class="form-control" value="72.4" />
        </div>
        <div class="col-12 md:col-6">
          <label for="perfil-actividad" class="form-label">Actividad</label>
          <select id="perfil-actividad" class="form-control">
            <option>Sedentario</option>
            <option>Ligero</option>
            <option selected>Moderado</option>
            <option>Activo</option>
          </select>
        </div>
        <div class="col-12 md:col-6">
          <label for="perfil-objetivo" class="form-label">Objetivo</label>
          <select id="perfil-objetivo" class="form-control">
            <option selected>Perder peso</option>
            <option>Mantener peso</option>
            <option>Ganar peso</option>
          </select>
        </div>
      </div>

      <button type="button" class="btn btn-solid theme-warning sano-btn-orange w-100 mt-4">
        Guardar cambios
      </button>
    </section>
  </div>

  <!-- Cerrar sesión -->
  <div class="col-12">
    <section class="sano-card card-sesion">
      <div>
        <h2 class="fs-lg mb-0">Sesión</h2>
        <p class="text-secondary-sano fs-sm mb-0">Sal de tu cuenta en este dispositivo.</p>
      </div>
      <button type="button" class="btn btn-outline">
        <i class="bi bi-box-arrow-right"></i> Cerrar sesión
      </button>
    </section>
  </div>
</div>
